server:
  servlet:
    context-path: /demo
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/farm_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  freemarker:
    content-type: text/html
    charset: UTF-8
    ## 是否开启缓存
    cache: false
    ## 模板路径
    template-loader-path: classpath:/templates
    # 模板后缀
    suffix: .html
  web:
    resources:
      static-locations: classpath:/static/

##日志配置
logging:
  level:
    root: info
    com.ywtong.springboothtml: debug
