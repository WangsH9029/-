<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>农户管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 0; }
        .content-container { margin: 20px; }
        .search-bar { margin-bottom: 20px; }
        .operation-bar { margin-bottom: 20px; }
        .farmer-info { margin-top: 10px; }
    </style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="/demo/js/axios-config.js"></script>
<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header">
                <span>农户管理</span>
                <el-button type="primary" size="small" style="float:right" @click="handleAdd">添加农户</el-button>
            </div>
            
            <!-- 搜索栏 -->
            <div class="search-bar">
                <el-form :inline="true" :model="searchForm">
                    <el-form-item label="农户名称">
                        <el-input v-model="searchForm.name" placeholder="请输入农户名称"></el-input>
                    </el-form-item>
                    <el-form-item label="认证状态">
                        <el-select v-model="searchForm.status" placeholder="请选择认证状态">
                            <el-option label="全部" value=""></el-option>
                            <el-option label="已认证" value="1"></el-option>
                            <el-option label="未认证" value="0"></el-option>
                            <el-option label="认证中" value="2"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="handleSearch">搜索</el-button>
                        <el-button @click="resetSearch">重置</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 农户列表 -->
            <el-table :data="farmers" style="width:100%" v-loading="loading">
                <el-table-column prop="username" label="登录账号" width="150"></el-table-column>
                <el-table-column prop="nickname" label="农户名称" width="150"></el-table-column>
                <el-table-column prop="phone" label="联系电话" width="150"></el-table-column>
                <el-table-column prop="email" label="邮箱" width="200"></el-table-column>
                <el-table-column prop="address" label="地址"></el-table-column>
                <el-table-column prop="isVerified" label="认证状态" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="getStatusType(scope.row.isVerified)">{{getStatusName(scope.row.isVerified)}}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="createTime" label="注册时间" width="180">
                    <template slot-scope="scope">
                        {{formatDate(scope.row.createTime)}}
                    </template>
                </el-table-column>
                <el-table-column label="操作" width="250">
                    <template slot-scope="scope">
                        <el-button type="text" size="small" @click="handleView(scope.row)">查看</el-button>
                        <el-button type="text" size="small" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button type="text" size="small" @click="handleVerify(scope.row)" v-if="!scope.row.isVerified">认证</el-button>
                        <el-button type="text" size="small" style="color:red" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div style="margin-top: 20px; text-align: right;">
                <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="total">
                </el-pagination>
            </div>
        </el-card>

        <!-- 添加/编辑农户对话框 -->
        <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="600px">
            <el-form :model="farmerForm" :rules="rules" ref="farmerForm" label-width="100px">
                <el-form-item label="农户名称" prop="nickname">
                    <el-input v-model="farmerForm.nickname" :disabled="isEdit" placeholder="将作为登录账号"></el-input>
                </el-form-item>
                <el-form-item label="联系电话" prop="phone">
                    <el-input v-model="farmerForm.phone"></el-input>
                </el-form-item>
                <el-form-item label="邮箱" prop="email">
                    <el-input v-model="farmerForm.email"></el-input>
                </el-form-item>
                <el-form-item label="地址" prop="address">
                    <el-input type="textarea" v-model="farmerForm.address"></el-input>
                </el-form-item>
                <el-form-item v-if="!isEdit">
                    <el-alert title="默认密码为：123456，请提醒农户登录后修改密码" type="info" :closable="false"></el-alert>
                </el-form-item>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button @click="dialogVisible = false">取 消</el-button>
                <el-button type="primary" @click="submitForm">确 定</el-button>
            </div>
        </el-dialog>

        <!-- 查看农户详情对话框 -->
        <el-dialog title="农户详情" :visible.sync="viewDialogVisible" width="800px">
            <el-descriptions :column="2" border>
                <el-descriptions-item label="登录账号">{{currentFarmer.username}}</el-descriptions-item>
                <el-descriptions-item label="农户名称">{{currentFarmer.nickname}}</el-descriptions-item>
                <el-descriptions-item label="联系电话">{{currentFarmer.phone}}</el-descriptions-item>
                <el-descriptions-item label="邮箱">{{currentFarmer.email}}</el-descriptions-item>
                <el-descriptions-item label="地址" :span="2">{{currentFarmer.address}}</el-descriptions-item>
                <el-descriptions-item label="认证状态">
                    <el-tag :type="getStatusType(currentFarmer.isVerified)">{{getStatusName(currentFarmer.isVerified)}}</el-tag>
                </el-descriptions-item>
                <el-descriptions-item label="注册时间">{{formatDate(currentFarmer.createTime)}}</el-descriptions-item>
            </el-descriptions>
        </el-dialog>

        <!-- 认证对话框 -->
        <el-dialog title="农户认证" :visible.sync="verifyDialogVisible" width="500px">
            <p>确认通过该农户的认证申请吗？</p>
            <div slot="footer" class="dialog-footer">
                <el-button @click="verifyDialogVisible = false">取 消</el-button>
                <el-button type="primary" @click="submitVerify">确 定</el-button>
            </div>
        </el-dialog>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data() {
            return {
                loading: false,
                farmers: [],
                searchForm: {
                    name: '',
                    status: ''
                },
                currentPage: 1,
                pageSize: 10,
                total: 0,
                dialogVisible: false,
                dialogTitle: '添加农户',
                isEdit: false,
                farmerForm: {
                    id: '',
                    nickname: '',
                    phone: '',
                    address: '',
                    email: ''
                },
                rules: {
                    nickname: [{ required: true, message: '请输入农户名称', trigger: 'blur' }],
                    phone: [{ required: true, message: '请输入联系电话', trigger: 'blur' }]
                },
                currentFarmer: {},
                viewDialogVisible: false,
                verifyDialogVisible: false,
                verifyForm: {
                    result: '1',
                    comment: ''
                }
            }
        },
        created() {
            this.fetchFarmers();
        },
        methods: {
            fetchFarmers() {
                this.loading = true;
                $axios.get('/demo/api/user/list', {
                    params: { role: 'ROLE_FARMER' }
                })
                    .then(res => {
                        this.farmers = res.data;
                        this.total = res.data.length;
                    })
                    .finally(() => {
                        this.loading = false;
                    });
            },
            handleSearch() {
                this.fetchFarmers();
            },
            resetSearch() {
                this.searchForm = { name: '', status: '' };
                this.fetchFarmers();
            },
            handleSizeChange(val) {
                this.pageSize = val;
            },
            handleCurrentChange(val) {
                this.currentPage = val;
            },
            handleAdd() {
                this.dialogTitle = '添加农户';
                this.isEdit = false;
                this.farmerForm = {
                    id: '',
                    nickname: '',
                    phone: '',
                    address: '',
                    email: ''
                };
                this.dialogVisible = true;
            },
            handleEdit(row) {
                this.dialogTitle = '编辑农户';
                this.isEdit = true;
                this.farmerForm = { ...row };
                this.dialogVisible = true;
            },
            submitForm() {
                this.$refs.farmerForm.validate(valid => {
                    if (!valid) return;
                    if (this.isEdit) {
                        $axios.put('/demo/api/user/' + this.farmerForm.id, {
                            ...this.farmerForm,
                            role: 'ROLE_FARMER'
                        }).then(() => {
                            this.$message.success('编辑成功');
                            this.dialogVisible = false;
                            this.fetchFarmers();
                        });
                    } else {
                        $axios.post('/demo/api/user/register', {
                            username: this.farmerForm.nickname,
                            nickname: this.farmerForm.nickname,
                            phone: this.farmerForm.phone,
                            email: this.farmerForm.email,
                            address: this.farmerForm.address,
                            role: 'ROLE_FARMER',
                            password: '123456',
                            isVerified: false
                        }).then(() => {
                            this.$message.success('添加成功，默认密码：123456');
                            this.dialogVisible = false;
                            this.fetchFarmers();
                        });
                    }
                });
            },
            handleDelete(row) {
                this.$confirm('确定要删除该农户吗？', '提示', { type: 'warning' })
                    .then(() => {
                        $axios.delete('/demo/api/user/' + row.id)
                            .then(() => {
                                this.$message.success('删除成功');
                                this.fetchFarmers();
                            });
                    });
            },
            handleView(row) {
                this.currentFarmer = { ...row };
                this.viewDialogVisible = true;
            },
            getStatusType(status) {
                return status ? 'success' : 'info';
            },
            getStatusName(status) {
                return status ? '已认证' : '未认证';
            },
            formatDate(date) {
                if (!date) return '';
                return new Date(date).toLocaleString('zh-CN');
            },
            handleVerify(row) {
                this.currentFarmer = row;
                this.verifyDialogVisible = true;
            },
            submitVerify() {
                $axios.put('/demo/api/user/' + this.currentFarmer.id + '/verify', null, {
                    params: { isVerified: true }
                }).then(() => {
                    this.$message.success('认证成功');
                    this.verifyDialogVisible = false;
                    this.fetchFarmers();
                });
            }
        }
    });
    </script>
</body>
</html>
