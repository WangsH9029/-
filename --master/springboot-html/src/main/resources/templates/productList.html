<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商品列表</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>body{margin:0;padding:0;}.content-container{margin:20px;padding:20px;}</style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header">
                <span>{{ pageTitle }}</span>
                <el-button v-if="canManageProducts" type="primary" size="small" style="float:right" @click="goAdd">添加商品</el-button>
            </div>
            <el-table :data="products" style="width:100%">
                <el-table-column label="图片" width="100">
                    <template slot-scope="scope">
                        <img v-if="getFirstImage(scope.row)" :src="getFirstImage(scope.row)" style="width:60px;height:60px;object-fit:cover;border-radius:4px;" :alt="scope.row.name">
                        <span v-else style="color:#999;font-size:12px;">无图片</span>
                    </template>
                </el-table-column>
                <el-table-column prop="name" label="商品名称" width="180"></el-table-column>
                <el-table-column prop="category" label="分类" width="120"></el-table-column>
                <el-table-column prop="price" label="价格" width="120"></el-table-column>
                <el-table-column prop="stock" label="库存" width="120"></el-table-column>
                <el-table-column prop="unit" label="单位" width="80"></el-table-column>
                <el-table-column v-if="isAdmin" :formatter="farmerName" label="农户" width="120"></el-table-column>
                <el-table-column v-if="canManageProducts" label="操作" width="150">
                    <template slot-scope="scope">
                        <el-button type="text" size="small" @click="openEditDialog(scope.row)">编辑</el-button>
                        <el-button type="text" size="small" style="color:red" @click="deleteProduct(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </el-card>
        <!-- 编辑商品弹窗 -->
        <el-dialog title="编辑商品" :visible.sync="editDialogVisible">
            <el-form :model="editForm" label-width="100px">
                <el-form-item label="商品名称"><el-input v-model="editForm.name"></el-input></el-form-item>
                <el-form-item label="分类"><el-input v-model="editForm.category"></el-input></el-form-item>
                <el-form-item label="价格"><el-input v-model="editForm.price" type="number"></el-input></el-form-item>
                <el-form-item label="库存"><el-input v-model="editForm.stock" type="number"></el-input></el-form-item>
                <el-form-item label="单位"><el-input v-model="editForm.unit"></el-input></el-form-item>
                <el-form-item label="商品描述">
                    <el-input v-model="editForm.description" type="textarea" :rows="4" placeholder="请输入商品描述"></el-input>
                </el-form-item>
                <el-form-item label="商品图片">
                    <el-upload
                        action="/demo/api/upload/image"
                        list-type="picture-card"
                        :on-success="handleUploadSuccess"
                        :on-remove="handleRemove"
                        :file-list="editFileList"
                        accept="image/*">
                        <i class="el-icon-plus"></i>
                    </el-upload>
                    <div style="color: #909399; font-size: 12px; margin-top: 5px;">或手动输入图片URL（多个用逗号分隔）</div>
                    <el-input v-model="editForm.images" placeholder="手动输入图片URL" style="margin-top: 5px;"></el-input>
                </el-form-item>
                <el-form-item label="农户" v-if="isAdmin">
                    <el-select v-model="editForm.farmerId" placeholder="请选择农户">
                        <el-option v-for="farmer in farmers" :key="farmer.id" :label="farmer.nickname" :value="farmer.id"></el-option>
                    </el-select>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button @click="editDialogVisible=false">取消</el-button>
                <el-button type="primary" @click="saveEdit">保存</el-button>
            </div>
        </el-dialog>
    </div>
</div>
<script>
new Vue({
    el:'#app',
    data(){
        return {
            products:[],
            farmers:[],
            editDialogVisible: false,
            isAdmin: false,
            isFarmer: false,
            canManageProducts: false,
            pageTitle: '商品列表',
            editForm: {id:'', name:'', category:'', price:'', stock:'', unit:'', description:'', images:'', farmerId:''},
            editFileList: []
        }
    },
    created() {
        axios.get('/demo/api/user/current')
            .then(res => {
                const user = res.data.body || {};
                this.isAdmin = user.role === 'ROLE_ADMIN';
                this.isFarmer = user.role === 'ROLE_FARMER';
                this.canManageProducts = this.isAdmin || this.isFarmer;
                this.pageTitle = this.isFarmer ? '我的商品' : '商品列表';
                this.fetchProducts();
                if (this.isAdmin) {
                    this.fetchFarmers();
                }
            })
            .catch(() => {
                window.location.href = '/demo/';
            });
    },
    methods:{
        goAdd(){window.location.href='toAddProduct';},
        farmerName(row) {
            return row.farmer && row.farmer.nickname ? row.farmer.nickname : '';
        },
        openEditDialog(row) {
            this.editForm = {
                id: row.id,
                name: row.name,
                category: row.category,
                price: row.price,
                stock: row.stock,
                unit: row.unit,
                description: row.description || '',
                images: row.images || '',
                farmerId: row.farmer && row.farmer.id ? row.farmer.id : ''
            };
            // 初始化已有图片列表
            this.editFileList = row.images ? row.images.split(',').map((url, index) => ({
                name: 'image_' + index,
                url: url.trim()
            })) : [];
            this.editDialogVisible = true;
        },
        handleUploadSuccess(response, file, fileList) {
            if (response.code === '200') {
                const uploadedUrls = fileList.map(f => f.response?.body || f.url).filter(Boolean);
                this.editForm.images = uploadedUrls.join(',');
            } else {
                this.$message.error(response.msg || '上传失败');
            }
        },
        handleRemove(file, fileList) {
            const uploadedUrls = fileList.map(f => f.response?.body || f.url).filter(Boolean);
            this.editForm.images = uploadedUrls.join(',');
        },
        saveEdit() {
            let product = {
                name: this.editForm.name,
                category: this.editForm.category,
                price: this.editForm.price,
                stock: this.editForm.stock,
                unit: this.editForm.unit,
                description: this.editForm.description,
                images: this.editForm.images
            };
            if (this.isAdmin && this.editForm.farmerId) {
                product.farmer = { id: this.editForm.farmerId };
            }
            axios.put('/demo/api/product/' + this.editForm.id, product)
                .then(() => {
                    this.$message.success('保存成功');
                    this.editDialogVisible = false;
                    this.fetchProducts();
                })
                .catch(err => {
                    const msg = err.response?.data?.massage || err.response?.data?.message || '保存失败';
                    this.$message.error(msg);
                });
        },
        deleteProduct(row) {
            this.$confirm('确定要删除该商品吗？', '提示', {
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                type: 'warning'
            }).then(() => {
                axios.delete('/demo/api/product/' + row.id)
                    .then(() => {
                        this.$message.success('删除成功');
                        this.fetchProducts();
                    })
                    .catch(err => {
                        const msg = err.response?.data?.massage || err.response?.data?.message || '删除失败';
                        this.$message.error(msg);
                    });
            });
        },
        fetchProducts() {
            const url = this.isFarmer ? '/demo/api/product/my' : '/demo/api/product/search';
            axios.get(url)
                .then(res => {
                    this.products = res.data.content || res.data;
                    if (this.isFarmer && this.products.length === 0) {
                        this.$message.info('您还没有发布商品');
                    }
                })
                .catch(() => {
                    this.$message.error('获取商品数据失败');
                });
        },
        fetchFarmers() {
            axios.get('/demo/api/user/list?role=ROLE_FARMER')
                .then(res => {
                    this.farmers = res.data.content || res.data;
                });
        },
        getFirstImage(item) {
            if (!item.images) return null;
            const images = item.images.split(',').map(url => url.trim()).filter(Boolean);
            return images.length > 0 ? images[0] : null;
        }
    }
})
</script>
</body>
</html>
