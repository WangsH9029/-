<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加商品</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>body{margin:0;padding:0;}.content-container{margin:20px;padding:20px;}</style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header"><span>{{ isAdmin ? '添加商品' : '发布商品' }}</span></div>
            <el-form :model="form" label-width="100px">
                <el-form-item label="商品名称"><el-input v-model="form.name"></el-input></el-form-item>
                <el-form-item label="分类"><el-input v-model="form.category"></el-input></el-form-item>
                <el-form-item label="价格"><el-input v-model="form.price" type="number"></el-input></el-form-item>
                <el-form-item label="库存"><el-input v-model="form.stock" type="number"></el-input></el-form-item>
                <el-form-item label="单位"><el-input v-model="form.unit"></el-input></el-form-item>
                <el-form-item label="商品描述">
                    <el-input v-model="form.description" type="textarea" :rows="4" placeholder="请输入商品描述"></el-input>
                </el-form-item>
                <el-form-item label="商品图片">
                    <el-upload
                        action="/demo/api/upload/image"
                        list-type="picture-card"
                        :on-success="handleUploadSuccess"
                        :on-remove="handleRemove"
                        :file-list="fileList"
                        accept="image/*">
                        <i class="el-icon-plus"></i>
                    </el-upload>
                    <div style="color: #909399; font-size: 12px; margin-top: 5px;">或手动输入图片URL（多个用逗号分隔）</div>
                    <el-input v-model="form.images" placeholder="手动输入图片URL" style="margin-top: 5px;"></el-input>
                </el-form-item>
                <el-form-item label="农户" v-if="isAdmin">
                    <el-select v-model="form.farmerId" placeholder="请选择农户">
                        <el-option v-for="farmer in farmers" :key="farmer.id" :label="farmer.nickname" :value="farmer.id"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="onSubmit">提交</el-button>
                    <el-button @click="onCancel">取消</el-button>
                </el-form-item>
            </el-form>
        </el-card>
    </div>
</div>
<script>
new Vue({
    el:'#app',
    data(){
        return {
            form:{name:'',category:'',price:'',stock:'',unit:'',description:'',images:'',farmerId:''},
            farmers:[],
            isAdmin:false,
            fileList: []
        }
    },
    created() {
        axios.get('/demo/api/user/current')
            .then(res => {
                const user = res.data.body || {};
                this.isAdmin = user.role === 'ROLE_ADMIN';
                if (this.isAdmin) {
                    return axios.get('/demo/api/user/list?role=ROLE_FARMER');
                }
                return null;
            })
            .then(res => {
                if (res) {
                    this.farmers = res.data.content || res.data;
                }
            })
            .catch(() => {
                window.location.href = '/demo/';
            });
    },
    methods:{
        handleUploadSuccess(response, file, fileList) {
            if (response.code === '200') {
                const uploadedUrls = fileList.map(f => f.response?.body || f.url).filter(Boolean);
                this.form.images = uploadedUrls.join(',');
            } else {
                this.$message.error(response.msg || '上传失败');
            }
        },
        handleRemove(file, fileList) {
            const uploadedUrls = fileList.map(f => f.response?.body || f.url).filter(Boolean);
            this.form.images = uploadedUrls.join(',');
        },
        onSubmit(){
            let product = {
                name: this.form.name,
                category: this.form.category,
                price: this.form.price,
                stock: this.form.stock,
                unit: this.form.unit,
                description: this.form.description,
                images: this.form.images
            };
            if (this.isAdmin && this.form.farmerId) {
                product.farmer = { id: this.form.farmerId };
            }
            axios.post('/demo/api/product', product)
                .then(() => {
                    this.$message.success('提交成功！');
                    setTimeout(()=>window.location.href='toProductList', 1000);
                })
                .catch(err => {
                    const msg = err.response?.data?.massage || err.response?.data?.message || '提交失败！';
                    this.$message.error(msg);
                });
        },
        onCancel(){window.location.href='toProductList';}
    }
})
</script>
</body>
</html>
