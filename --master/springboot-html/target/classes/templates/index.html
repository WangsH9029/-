<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农产品交易平台 - 登录</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/vue@2/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a6b3c 0%, #2d9e5f 40%, #52c78a 70%, #a8e6c3 100%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }
        .login-wrapper {
            display: flex;
            width: 860px;
            min-height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        /* 左侧品牌区 */
        .brand-panel {
            flex: 1;
            background: linear-gradient(160deg, #1a6b3c, #2d9e5f);
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
        }
        .brand-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .brand-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .brand-subtitle {
            font-size: 14px;
            opacity: 0.85;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .brand-features {
            list-style: none;
            padding: 0; margin: 0;
        }
        .brand-features li {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-features li::before {
            content: '✓';
            width: 18px; height: 18px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        /* 右侧登录区 */
        .login-panel {
            width: 380px;
            background: #fff;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-header {
            margin-bottom: 32px;
        }
        .login-header h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin: 0 0 6px 0;
            font-weight: 600;
        }
        .login-header p {
            font-size: 13px;
            color: #909399;
            margin: 0;
        }
        .el-form-item { margin-bottom: 20px; }
        .el-input__inner { border-radius: 8px; height: 44px; }
        .login-btn {
            width: 100%;
            height: 44px;
            border-radius: 8px;
            font-size: 15px;
            background: linear-gradient(135deg, #2d9e5f, #1a6b3c);
            border: none;
            letter-spacing: 1px;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #52c78a, #2d9e5f);
        }
        .forgot-link {
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="login-wrapper">
        <!-- 左侧品牌区 -->
        <div class="brand-panel">
            <div class="brand-logo">🌾</div>
            <div class="brand-title">农产品交易平台</div>
            <div class="brand-subtitle">连接农户与消费者，让新鲜农产品<br>直达您的餐桌</div>
            <ul class="brand-features">
                <li>产地直供，新鲜保障</li>
                <li>支持农户直接发布商品</li>
                <li>透明价格，公平交易</li>
                <li>助力乡村振兴战略</li>
            </ul>
        </div>
        <!-- 右侧登录区 -->
        <div class="login-panel">
            <div class="login-header">
                <h2>欢迎回来</h2>
                <p>请登录您的账号以继续</p>
            </div>
            <el-form :model="form" :rules="rules" ref="form" label-position="top">
                <el-form-item label="账号" prop="account">
                    <el-input v-model="form.account" placeholder="请输入账号" clearable prefix-icon="el-icon-user"></el-input>
                </el-form-item>
                <el-form-item label="密码" prop="password">
                    <el-input v-model="form.password" type="password" placeholder="请输入密码" show-password prefix-icon="el-icon-lock" @keyup.enter.native="submitForm('form')"></el-input>
                </el-form-item>
                <el-form-item style="margin-bottom:12px;">
                    <el-button type="primary" class="login-btn" @click="submitForm('form')">登 录</el-button>
                </el-form-item>
            </el-form>
            <div class="forgot-link">
                <el-button type="text" @click="showForgotPassword" style="color:#2d9e5f;">忘记密码？</el-button>
            </div>
        </div>
    </div>

    <!-- 忘记密码对话框 -->
    <el-dialog title="重置密码" :visible.sync="forgotPasswordVisible" width="420px">
        <el-form :model="resetForm" :rules="resetRules" ref="resetForm" label-width="80px">
            <el-form-item label="手机号" prop="phone">
                <el-input v-model="resetForm.phone" placeholder="请输入注册手机号"></el-input>
            </el-form-item>
            <el-form-item label="验证码" prop="code">
                <div style="display:flex;gap:8px;">
                    <el-input v-model="resetForm.code" placeholder="请输入验证码"></el-input>
                    <el-button @click="sendCode" :disabled="countdown > 0" style="flex-shrink:0;width:110px;">
                        {{ countdown > 0 ? countdown + 's后重发' : '发送验证码' }}
                    </el-button>
                </div>
            </el-form-item>
            <el-form-item label="新密码" prop="newPassword">
                <el-input v-model="resetForm.newPassword" type="password" placeholder="请输入新密码" show-password></el-input>
            </el-form-item>
            <el-form-item label="确认密码" prop="confirmPassword">
                <el-input v-model="resetForm.confirmPassword" type="password" placeholder="请再次输入新密码" show-password></el-input>
            </el-form-item>
        </el-form>
        <div slot="footer">
            <el-button @click="forgotPasswordVisible = false">取消</el-button>
            <el-button type="primary" @click="submitReset">确定重置</el-button>
        </div>
    </el-dialog>
</div>

<script>
new Vue({
    el: '#app',
    data() {
        const validateConfirmPassword = (rule, value, callback) => {
            if (value !== this.resetForm.newPassword) {
                callback(new Error('两次输入的密码不一致'));
            } else {
                callback();
            }
        };
        return {
            form: { account: '', password: '' },
            rules: {
                account: [{ required: true, message: '请输入账号', trigger: 'blur' }],
                password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
            },
            forgotPasswordVisible: false,
            resetForm: { phone: '', code: '', newPassword: '', confirmPassword: '' },
            resetRules: {
                phone: [
                    { required: true, message: '请输入手机号', trigger: 'blur' },
                    { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的11位手机号码', trigger: 'blur' }
                ],
                code: [
                    { required: true, message: '请输入验证码', trigger: 'blur' },
                    { pattern: /^\d{6}$/, message: '验证码为6位数字', trigger: 'blur' }
                ],
                newPassword: [
                    { required: true, message: '请输入新密码', trigger: 'blur' },
                    { min: 6, message: '密码长度不能少于6位', trigger: 'blur' }
                ],
                confirmPassword: [
                    { required: true, message: '请再次输入新密码', trigger: 'blur' },
                    { validator: validateConfirmPassword, trigger: 'blur' }
                ]
            },
            countdown: 0,
            receivedCode: ''
        };
    },
    methods: {
        showForgotPassword() {
            this.forgotPasswordVisible = true;
            this.resetForm = { phone: '', code: '', newPassword: '', confirmPassword: '' };
            this.countdown = 0;
        },
        sendCode() {
            if (!this.resetForm.phone || !this.resetForm.phone.match(/^1[3-9]\d{9}$/)) {
                this.$message.error('请输入正确的手机号码');
                return;
            }
            $.ajax({
                url: '/demo/api/user/send-code',
                type: 'POST',
                data: { phone: this.resetForm.phone },
                success: (response) => {
                    if (response.code === '200') {
                        this.receivedCode = response.body;
                        this.$message.success('验证码已发送（测试环境：' + response.body + '）');
                        this.countdown = 60;
                        const timer = setInterval(() => {
                            this.countdown--;
                            if (this.countdown <= 0) clearInterval(timer);
                        }, 1000);
                    } else {
                        this.$message.error(response.msg || '发送失败');
                    }
                },
                error: () => { this.$message.error('发送验证码失败'); }
            });
        },
        submitReset() {
            this.$refs.resetForm.validate((valid) => {
                if (!valid) return;
                $.ajax({
                    url: '/demo/api/user/reset-password',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        phone: this.resetForm.phone,
                        code: this.resetForm.code,
                        newPassword: this.resetForm.newPassword
                    }),
                    success: (response) => {
                        if (response.code === '200') {
                            this.$message.success('密码重置成功，请使用新密码登录');
                            this.forgotPasswordVisible = false;
                        } else {
                            this.$message.error(response.msg || '重置失败');
                        }
                    },
                    error: () => { this.$message.error('密码重置失败'); }
                });
            });
        },
        submitForm(formName) {
            this.$refs[formName].validate((valid) => {
                if (!valid) return;
                $.ajax({
                    url: '/demo/login',
                    type: 'POST',
                    data: { account: this.form.account, password: this.form.password },
                    success: (response) => {
                        const success = response.code === '200';
                        this.$message({ message: response.msg, type: success ? 'success' : 'error' });
                        if (!success || !response.body) return;
                        if (response.body.token) {
                            localStorage.setItem('jwt_token', response.body.token);
                        }
                        setTimeout(() => {
                            if (response.body.role === 'ROLE_ADMIN') {
                                window.location.href = 'toMain';
                            } else if (response.body.role === 'ROLE_FARMER') {
                                window.location.href = 'toMainForFarmer';
                            } else {
                                window.location.href = 'toMainForUser';
                            }
                        }, 100);
                    },
                    error: () => { this.$message.error('登录失败，请检查网络或服务器'); }
                });
            });
        }
    }
});
</script>
</body>
</html>
