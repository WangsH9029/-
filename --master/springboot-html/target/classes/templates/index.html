<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AAA智慧农业 登录</title>
    <!-- Element UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@2/dist/vue.min.js"></script>
    <!-- Element UI JS -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #303133;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="login-container">
        <h2 class="login-title">用户登录</h2>
        <el-form :model="form" :rules="rules" ref="form" label-position="top">
            <el-form-item label="账号" prop="account">
                <el-input v-model="form.account" placeholder="请输入账号" clearable></el-input>
            </el-form-item>
            <el-form-item label="密码" prop="password">
                <el-input v-model="form.password" type="password" placeholder="请输入密码" show-password></el-input>
            </el-form-item>
            <el-form-item>
                <el-button type="primary" @click="submitForm('form')" style="width: 100%;">提交</el-button>
            </el-form-item>
            <el-form-item style="text-align: center;">
                <el-button type="text" @click="showForgotPassword">忘记密码？</el-button>
            </el-form-item>
        </el-form>

        <!-- 忘记密码对话框 -->
        <el-dialog title="忘记密码" :visible.sync="forgotPasswordVisible" width="400px">
            <el-form :model="resetForm" :rules="resetRules" ref="resetForm" label-width="80px">
                <el-form-item label="手机号" prop="phone">
                    <el-input v-model="resetForm.phone" placeholder="请输入注册手机号"></el-input>
                </el-form-item>
                <el-form-item label="验证码" prop="code">
                    <el-input v-model="resetForm.code" placeholder="请输入验证码" style="width: 60%;">
                    </el-input>
                    <el-button @click="sendCode" :disabled="countdown > 0" style="margin-left: 10px;">
                        {{ countdown > 0 ? countdown + 's' : '发送验证码' }}
                    </el-button>
                </el-form-item>
                <el-form-item label="新密码" prop="newPassword">
                    <el-input v-model="resetForm.newPassword" type="password" placeholder="请输入新密码" show-password></el-input>
                </el-form-item>
                <el-form-item label="确认密码" prop="confirmPassword">
                    <el-input v-model="resetForm.confirmPassword" type="password" placeholder="请再次输入新密码" show-password></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button @click="forgotPasswordVisible = false">取消</el-button>
                <el-button type="primary" @click="submitReset">确定</el-button>
            </div>
        </el-dialog>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data() {
            const validateConfirmPassword = (rule, value, callback) => {
                if (value !== this.resetForm.newPassword) {
                    callback(new Error('两次输入的密码不一致'));
                } else {
                    callback();
                }
            };
            return {
                form: {
                    account: '',
                    password: ''
                },
                rules: {
                    account: [
                        { required: true, message: '请输入账号', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '请输入密码', trigger: 'blur' }
                    ]
                },
                forgotPasswordVisible: false,
                resetForm: {
                    phone: '',
                    code: '',
                    newPassword: '',
                    confirmPassword: ''
                },
                resetRules: {
                    phone: [
                        { required: true, message: '请输入手机号', trigger: 'blur' },
                        { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的11位手机号码', trigger: 'blur' }
                    ],
                    code: [
                        { required: true, message: '请输入验证码', trigger: 'blur' },
                        { pattern: /^\d{6}$/, message: '验证码为6位数字', trigger: 'blur' }
                    ],
                    newPassword: [
                        { required: true, message: '请输入新密码', trigger: 'blur' },
                        { min: 6, message: '密码长度不能少于6位', trigger: 'blur' }
                    ],
                    confirmPassword: [
                        { required: true, message: '请再次输入新密码', trigger: 'blur' },
                        { validator: validateConfirmPassword, trigger: 'blur' }
                    ]
                },
                countdown: 0,
                receivedCode: ''
            };
        },
        methods: {
            showForgotPassword() {
                this.forgotPasswordVisible = true;
                this.resetForm = {
                    phone: '',
                    code: '',
                    newPassword: '',
                    confirmPassword: ''
                };
                this.countdown = 0;
                this.receivedCode = '';
            },
            sendCode() {
                if (!this.resetForm.phone) {
                    this.$message.warning('请先输入手机号');
                    return;
                }
                if (!this.resetForm.phone.match(/^1[3-9]\d{9}$/)) {
                    this.$message.error('请输入正确的11位手机号码');
                    return;
                }

                $.ajax({
                    url: '/demo/api/user/send-code',
                    type: 'POST',
                    data: { phone: this.resetForm.phone },
                    success: (response) => {
                        if (response.code === '200') {
                            this.receivedCode = response.body;
                            this.$message.success('验证码已发送（测试环境：' + response.body + '）');
                            this.countdown = 60;
                            const timer = setInterval(() => {
                                this.countdown--;
                                if (this.countdown <= 0) {
                                    clearInterval(timer);
                                }
                            }, 1000);
                        } else {
                            this.$message.error(response.msg || '发送失败');
                        }
                    },
                    error: () => {
                        this.$message.error('发送验证码失败');
                    }
                });
            },
            submitReset() {
                this.$refs.resetForm.validate((valid) => {
                    if (!valid) return;

                    $.ajax({
                        url: '/demo/api/user/reset-password',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            phone: this.resetForm.phone,
                            code: this.resetForm.code,
                            newPassword: this.resetForm.newPassword
                        }),
                        success: (response) => {
                            if (response.code === '200') {
                                this.$message.success('密码重置成功，请使用新密码登录');
                                this.forgotPasswordVisible = false;
                                this.form.password = '';
                            } else {
                                this.$message.error(response.msg || '重置失败');
                            }
                        },
                        error: () => {
                            this.$message.error('密码重置失败');
                        }
                    });
                });
            },
            submitForm(formName) {
                this.$refs[formName].validate((valid) => {
                    if (valid) {
                        $.ajax({
                            url: '/demo/login',
                            type: 'POST',
                            data: {
                                account: this.form.account,
                                password: this.form.password
                            },
                            success: (response) => {
                                const success = response.code === '200';
                                this.$message({
                                    message: response.msg,
                                    type: success ? 'success' : 'error'
                                });
                                if (!success || !response.body) {
                                    return;
                                }
                                if (response.body.role === 'ROLE_ADMIN') {
                                    window.location.href = 'toMain';
                                } else if (response.body.role === 'ROLE_FARMER') {
                                    window.location.href = 'toMainForFarmer';
                                } else {
                                    window.location.href = 'toMainForUser';
                                }
                            },
                            error: () => {
                                this.$message.error('登录失败，请检查网络或服务器');
                            }
                        });
                    } else {
                        return false;
                    }
                });
            }
        }
    });
</script>
</body>
</html>
