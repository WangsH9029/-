<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>订单列表</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 0; }
        .content-container { margin: 20px; padding: 20px; }
        .pay-qrcode-placeholder {
            height: 180px;
            border: 1px dashed #dcdfe6;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #909399;
            background: #fafafa;
        }
    </style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header">
                <span>{{ pageTitle }}</span>
            </div>
            <el-table :data="orders" style="width:100%" v-loading="loading">
                <el-table-column prop="orderNo" label="订单编号" width="180"></el-table-column>
                <el-table-column v-if="isAdmin || isFarmer" label="客户名称" width="120">
                    <template slot-scope="scope">
                        {{ scope.row.user && (scope.row.user.nickname || scope.row.user.username) }}
                    </template>
                </el-table-column>
                <el-table-column prop="totalAmount" label="订单金额" width="120"></el-table-column>
                <el-table-column label="订单状态" width="120">
                    <template slot-scope="scope">
                        <el-tag :type="getStatusTag(scope.row.status)">
                            {{ getStatusName(scope.row.status) }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="createTime" label="创建时间"></el-table-column>
                <el-table-column label="操作" width="320">
                    <template slot-scope="scope">
                        <el-button v-if="isAdmin" type="text" size="small" @click="handleDelete(scope.row)" style="color:red">删除</el-button>
                        <el-button v-if="!isAdmin && !isFarmer && scope.row.status === 'PENDING_PAYMENT'" type="text" size="small" @click="openEditDialog(scope.row)">修改收货信息</el-button>
                        <el-button v-if="!isAdmin && !isFarmer && scope.row.status === 'PENDING_PAYMENT'" type="text" size="small" @click="openPayDialog(scope.row)">支付</el-button>
                        <el-button v-if="!isAdmin && !isFarmer && scope.row.status === 'PENDING_PAYMENT'" type="text" size="small" @click="handleCancel(scope.row)">取消订单</el-button>
                        <el-button v-if="isFarmer && scope.row.status === 'PAID'" type="text" size="small" @click="handleProcess(scope.row, 'SHIPPED')">发货</el-button>
                        <el-button v-if="isFarmer && scope.row.status === 'SHIPPED'" type="text" size="small" @click="handleProcess(scope.row, 'COMPLETED')">完成</el-button>
                        <el-button type="text" size="small">详情</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </el-card>

        <el-dialog title="修改收货信息" :visible.sync="editDialogVisible" width="480px">
            <el-form :model="editForm" :rules="editRules" ref="editForm" label-width="90px">
                <el-form-item label="联系电话" prop="phone">
                    <el-input v-model="editForm.phone"></el-input>
                </el-form-item>
                <el-form-item label="收货地址" prop="address">
                    <el-input v-model="editForm.address"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button @click="editDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmEdit">保存</el-button>
            </div>
        </el-dialog>

        <el-dialog title="订单支付" :visible.sync="payDialogVisible" width="480px">
            <div style="line-height: 30px; margin-bottom: 16px;">
                <div>订单编号：{{ payOrder.orderNo || '-' }}</div>
                <div>订单金额：¥ {{ payOrder.totalAmount || 0 }}</div>
                <div>支付方式：{{ payOrder.paymentMethod || '未选择' }}</div>
            </div>
            <div class="pay-qrcode-placeholder">二维码预留区域</div>
            <div slot="footer">
                <el-button @click="payDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmPay">确认支付</el-button>
            </div>
        </el-dialog>
    </div>
</div>
<script>
new Vue({
    el: '#app',
    data() {
        return {
            orders: [],
            loading: false,
            pageTitle: '订单列表',
            isAdmin: false,
            isFarmer: false,
            payDialogVisible: false,
            payOrder: {},
            editDialogVisible: false,
            editOrder: {},
            editForm: {
                phone: '',
                address: ''
            },
            editRules: {
                address: [{ required: true, message: '请输入收货地址', trigger: 'blur' }],
                phone: [
                    { required: true, message: '请输入联系电话', trigger: 'blur' },
                    { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的11位手机号码', trigger: 'blur' }
                ]
            }
        }
    },
    created() {
        axios.get('/demo/api/user/current')
            .then(res => {
                const user = res.data.body || {};
                this.isAdmin = user.role === 'ROLE_ADMIN';
                this.isFarmer = user.role === 'ROLE_FARMER';
                this.pageTitle = this.isAdmin ? '订单列表' : (this.isFarmer ? '销售订单' : '我的订单');
                this.fetchOrders();
            })
            .catch(() => {
                window.location.href = '/demo/';
            });
    },
    methods: {
        fetchOrders() {
            this.loading = true;
            axios.get('/demo/api/order/list')
                .then(res => {
                    this.orders = res.data.content || res.data;
                    if (!this.isAdmin && !this.isFarmer && this.orders.length === 0) {
                        this.$message.info('您还没有订单');
                    }
                    if (this.isFarmer && this.orders.length === 0) {
                        this.$message.info('暂无与您商品相关的订单');
                    }
                })
                .finally(() => {
                    this.loading = false;
                });
        },
        handleDelete(row) {
            this.$confirm('确定要删除该订单吗？', '提示', { type: 'warning' })
                .then(() => {
                    axios.delete('/demo/api/order/' + row.id)
                        .then(() => {
                            this.$message.success('删除成功');
                            this.fetchOrders();
                        })
                        .catch(err => {
                            const msg = err.response?.data?.massage || err.response?.data?.message || '删除失败';
                            this.$message.error(msg);
                        });
                });
        },
        handleCancel(row) {
            this.$confirm('确定要取消该订单吗？', '提示', { type: 'warning' })
                .then(() => {
                    axios.put('/demo/api/order/' + row.id + '/cancel')
                        .then(() => {
                            this.$message.success('取消成功');
                            this.fetchOrders();
                        })
                        .catch(err => {
                            const msg = err.response?.data?.massage || err.response?.data?.message || '取消失败';
                            this.$message.error(msg);
                        });
                });
        },
        openEditDialog(row) {
            this.editOrder = row;
            this.editForm = {
                phone: row.phone || '',
                address: row.address || ''
            };
            this.editDialogVisible = true;
        },
        confirmEdit() {
            this.$refs.editForm.validate(valid => {
                if (!valid) return;
                axios.put('/demo/api/order/' + this.editOrder.id + '/contact', this.editForm)
                    .then(() => {
                        this.$message.success('收货信息修改成功');
                        this.editDialogVisible = false;
                        this.fetchOrders();
                    })
                    .catch(err => {
                        const msg = err.response?.data?.massage || err.response?.data?.message || '修改失败';
                        this.$message.error(msg);
                    });
            });
        },
        openPayDialog(row) {
            this.payOrder = row;
            this.payDialogVisible = true;
        },
        confirmPay() {
            axios.put('/demo/api/order/' + this.payOrder.id + '/pay')
                .then(() => {
                    this.$message.success('支付成功');
                    this.payDialogVisible = false;
                    this.fetchOrders();
                })
                .catch(err => {
                    const msg = err.response?.data?.massage || err.response?.data?.message || '支付失败';
                    this.$message.error(msg);
                });
        },
        handleProcess(row, status) {
            const actionText = status === 'SHIPPED' ? '发货' : '完成';
            this.$confirm('确定要执行' + actionText + '操作吗？', '提示', { type: 'warning' })
                .then(() => {
                    axios.put('/demo/api/order/' + row.id + '/status', null, {
                        params: { status }
                    }).then(() => {
                        this.$message.success(actionText + '成功');
                        this.fetchOrders();
                    }).catch(err => {
                        const msg = err.response?.data?.massage || err.response?.data?.message || actionText + '失败';
                        this.$message.error(msg);
                    });
                });
        },
        getStatusTag(status) {
            switch(status) {
                case 'COMPLETED': return 'success';
                case 'CANCELLED': return 'info';
                case 'PAID': return 'primary';
                case 'SHIPPED': return 'warning';
                default: return 'danger';
            }
        },
        getStatusName(status) {
            switch(status) {
                case 'COMPLETED': return '已完成';
                case 'CANCELLED': return '已取消';
                case 'PAID': return '已支付';
                case 'SHIPPED': return '已发货';
                case 'PENDING_PAYMENT': return '待支付';
                default: return status;
            }
        }
    }
});
</script>
</body>
</html>
