<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 0; }
        .content-container { margin: 20px; }
        .search-bar { margin-bottom: 20px; }
        .operation-bar { margin-bottom: 20px; }
    </style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/demo/js/axios-config.js"></script>
<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header">
                <span>用户管理</span>
                <el-button type="primary" size="small" style="float:right" @click="handleAdd">添加用户</el-button>
            </div>
            
            <!-- 搜索栏 -->
            <div class="search-bar">
                <el-form :inline="true" :model="searchForm">
                    <el-form-item label="用户名">
                        <el-input v-model="searchForm.username" placeholder="请输入用户名"></el-input>
                    </el-form-item>
                    <el-form-item label="角色">
                        <el-select v-model="searchForm.role" placeholder="请选择角色" clearable>
                            <el-option label="全部" value=""></el-option>
                            <el-option label="管理员" value="ROLE_ADMIN"></el-option>
                            <el-option label="普通用户" value="ROLE_USER"></el-option>
                            <el-option label="农户" value="ROLE_FARMER"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="handleSearch">搜索</el-button>
                        <el-button @click="resetSearch">重置</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 用户列表 -->
            <el-table :data="pagedUsers" style="width:100%" v-loading="loading">
                <el-table-column prop="username" label="用户名" width="120"></el-table-column>
                <el-table-column prop="nickname" label="昵称" width="120"></el-table-column>
                <el-table-column prop="role" label="角色" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="getRoleType(scope.row.role)">{{getRoleName(scope.row.role)}}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="phone" label="电话" width="150"></el-table-column>
                <el-table-column prop="email" label="邮箱"></el-table-column>
                <el-table-column prop="address" label="地址" width="180"></el-table-column>
                <el-table-column label="认证状态" width="100">
                    <template slot-scope="scope">
                        <el-tag v-if="scope.row.role === 'ROLE_FARMER'" :type="scope.row.isVerified ? 'success' : 'info'">
                            {{ scope.row.isVerified ? '已认证' : '未认证' }}
                        </el-tag>
                        <span v-else>-</span>
                    </template>
                </el-table-column>
                <el-table-column prop="createTime" label="创建时间" width="180"></el-table-column>
                <el-table-column label="操作" width="200">
                    <template slot-scope="scope">
                        <el-button type="text" size="small" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button type="text" size="small" style="color:red" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div style="margin-top: 20px; text-align: right;">
                <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="total">
                </el-pagination>
            </div>
        </el-card>

        <!-- 添加/编辑用户对话框 -->
        <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="500px">
            <el-form :model="userForm" :rules="rules" ref="userForm" label-width="100px">
                <el-form-item label="用户名" prop="username">
                    <el-input v-model="userForm.username" :disabled="isEdit"></el-input>
                </el-form-item>
                <el-form-item label="昵称" prop="nickname">
                    <el-input v-model="userForm.nickname"></el-input>
                </el-form-item>
                <el-form-item label="角色" prop="role">
                    <el-select v-model="userForm.role" placeholder="请选择角色">
                        <el-option label="管理员" value="ROLE_ADMIN"></el-option>
                        <el-option label="普通用户" value="ROLE_USER"></el-option>
                        <el-option label="农户" value="ROLE_FARMER"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="电话" prop="phone">
                    <el-input v-model="userForm.phone"></el-input>
                </el-form-item>
                <el-form-item label="邮箱" prop="email">
                    <el-input v-model="userForm.email"></el-input>
                </el-form-item>
                <el-form-item label="地址" prop="address">
                    <el-input v-model="userForm.address"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button @click="dialogVisible = false">取 消</el-button>
                <el-button type="primary" @click="submitForm">确 定</el-button>
            </div>
        </el-dialog>
    </div>
</div>

<script>
new Vue({
    el: '#app',
    data() {
        return {
            loading: false,
            users: [],
            searchForm: {
                username: '',
                role: ''
            },
            currentPage: 1,
            pageSize: 10,
            total: 0,
            dialogVisible: false,
            dialogTitle: '添加用户',
            isEdit: false,
            userForm: {
                id: null,
                username: '',
                nickname: '',
                role: '',
                phone: '',
                email: '',
                address: '',
                isVerified: false
            },
            rules: {
                username: [
                    { required: true, message: '请输入用户名', trigger: 'blur' }
                ],
                nickname: [
                    { required: true, message: '请输入昵称', trigger: 'blur' }
                ],
                role: [
                    { required: true, message: '请选择角色', trigger: 'change' }
                ],
                phone: [
                    { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号码', trigger: 'blur' }
                ],
                email: [
                    { type: 'email', message: '请输入正确的邮箱地址', trigger: 'blur' }
                ]
            }
        }
    },
    computed: {
        pagedUsers() {
            const start = (this.currentPage - 1) * this.pageSize;
            const end = start + this.pageSize;
            return this.users.slice(start, end);
        }
    },
    created() {
        this.fetchUsers();
    },
    methods: {
        fetchUsers() {
            this.loading = true;
            $axios.get('/demo/api/user/list', {
                params: {
                    role: this.searchForm.role || undefined
                }
            }).then(res => {
                const keyword = (this.searchForm.username || '').trim().toLowerCase();
                const list = Array.isArray(res.data) ? res.data : [];
                this.users = keyword
                    ? list.filter(user => {
                        const username = (user.username || '').toLowerCase();
                        const nickname = (user.nickname || '').toLowerCase();
                        return username.includes(keyword) || nickname.includes(keyword);
                    })
                    : list;
                this.total = this.users.length;
                if (this.currentPage > Math.ceil(this.total / this.pageSize) && this.total > 0) {
                    this.currentPage = 1;
                }
            }).finally(() => {
                this.loading = false;
            });
        },
        getRoleType(role) {
            const types = {
                'ROLE_ADMIN': 'danger',
                'ROLE_USER': 'success',
                'ROLE_FARMER': 'warning'
            };
            return types[role] || 'info';
        },
        getRoleName(role) {
            const names = {
                'ROLE_ADMIN': '管理员',
                'ROLE_USER': '普通用户',
                'ROLE_FARMER': '农户'
            };
            return names[role] || role;
        },
        handleSearch() {
            this.currentPage = 1;
            this.fetchUsers();
        },
        resetSearch() {
            this.searchForm = {
                username: '',
                role: ''
            };
            this.currentPage = 1;
            this.fetchUsers();
        },
        handleSizeChange(val) {
            this.pageSize = val;
            this.currentPage = 1;
        },
        handleCurrentChange(val) {
            this.currentPage = val;
        },
        handleAdd() {
            this.dialogTitle = '添加用户';
            this.isEdit = false;
            this.userForm = {
                id: null,
                username: '',
                nickname: '',
                role: 'ROLE_USER',
                phone: '',
                email: '',
                address: '',
                isVerified: false
            };
            this.dialogVisible = true;
        },
        handleEdit(row) {
            this.dialogTitle = '编辑用户';
            this.isEdit = true;
            this.userForm = { ...row };
            this.dialogVisible = true;
        },
        handleDelete(row) {
            this.$confirm('确认删除该用户吗？', '提示', {
                type: 'warning'
            }).then(() => {
                $axios.delete('/demo/api/user/' + row.id)
                    .then(() => {
                        this.$message.success('删除成功');
                        this.fetchUsers();
                    });
            }).catch(() => {});
        },
        submitForm() {
            this.$refs.userForm.validate((valid) => {
                if (!valid) {
                    return;
                }
                const payload = {
                    username: this.userForm.username,
                    nickname: this.userForm.nickname,
                    role: this.userForm.role,
                    phone: this.userForm.phone,
                    email: this.userForm.email,
                    address: this.userForm.address,
                    isVerified: this.userForm.isVerified
                };
                const request = this.isEdit
                    ? $axios.put('/demo/api/user/' + this.userForm.id, payload)
                    : $axios.post('/demo/api/user/register', {
                        ...payload,
                        password: '123456'
                    });
                request.then(() => {
                    this.$message.success(this.isEdit ? '修改成功' : '添加成功，默认密码为123456');
                    this.dialogVisible = false;
                    this.fetchUsers();
                });
            });
        }
    }
})
</script>
</body>
</html>
