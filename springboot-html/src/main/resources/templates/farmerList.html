<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>农户管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 0; }
        .content-container { margin: 20px; }
        .search-bar { margin-bottom: 20px; }
        .operation-bar { margin-bottom: 20px; }
        .farmer-info { margin-top: 10px; }
    </style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header">
                <span>农户管理</span>
                <el-button type="primary" size="small" style="float:right" @click="handleAdd">添加农户</el-button>
            </div>
            
            <!-- 搜索栏 -->
            <div class="search-bar">
                <el-form :inline="true" :model="searchForm">
                    <el-form-item label="农户名称">
                        <el-input v-model="searchForm.name" placeholder="请输入农户名称"></el-input>
                    </el-form-item>
                    <el-form-item label="认证状态">
                        <el-select v-model="searchForm.status" placeholder="请选择认证状态">
                            <el-option label="全部" value=""></el-option>
                            <el-option label="已认证" value="1"></el-option>
                            <el-option label="未认证" value="0"></el-option>
                            <el-option label="认证中" value="2"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="handleSearch">搜索</el-button>
                        <el-button @click="resetSearch">重置</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 农户列表 -->
            <el-table :data="farmers" style="width:100%" v-loading="loading">
                <el-table-column prop="name" label="农户名称" width="150"></el-table-column>
                <el-table-column prop="contact" label="联系人" width="120"></el-table-column>
                <el-table-column prop="phone" label="联系电话" width="150"></el-table-column>
                <el-table-column prop="address" label="地址"></el-table-column>
                <el-table-column prop="area" label="种植面积(亩)" width="120"></el-table-column>
                <el-table-column prop="crops" label="主要作物" width="150"></el-table-column>
                <el-table-column prop="status" label="认证状态" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="getStatusType(scope.row.status)">{{getStatusName(scope.row.status)}}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="createTime" label="注册时间" width="180"></el-table-column>
                <el-table-column label="操作" width="250">
                    <template slot-scope="scope">
                        <el-button type="text" size="small" @click="handleView(scope.row)">查看</el-button>
                        <el-button type="text" size="small" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button type="text" size="small" @click="handleVerify(scope.row)" v-if="scope.row.status === '2'">认证</el-button>
                        <el-button type="text" size="small" style="color:red" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div style="margin-top: 20px; text-align: right;">
                <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="total">
                </el-pagination>
            </div>
        </el-card>

        <!-- 添加/编辑农户对话框 -->
        <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="600px">
            <el-form :model="farmerForm" :rules="rules" ref="farmerForm" label-width="100px">
                <el-form-item label="农户名称" prop="name">
                    <el-input v-model="farmerForm.name"></el-input>
                </el-form-item>
                <el-form-item label="联系人" prop="contact">
                    <el-input v-model="farmerForm.contact"></el-input>
                </el-form-item>
                <el-form-item label="联系电话" prop="phone">
                    <el-input v-model="farmerForm.phone"></el-input>
                </el-form-item>
                <el-form-item label="地址" prop="address">
                    <el-input type="textarea" v-model="farmerForm.address"></el-input>
                </el-form-item>
                <el-form-item label="种植面积" prop="area">
                    <el-input-number v-model="farmerForm.area" :min="0" :precision="2"></el-input-number>
                    <span class="unit">亩</span>
                </el-form-item>
                <el-form-item label="主要作物" prop="crops">
                    <el-select v-model="farmerForm.crops" multiple placeholder="请选择主要作物">
                        <el-option label="水稻" value="rice"></el-option>
                        <el-option label="小麦" value="wheat"></el-option>
                        <el-option label="玉米" value="corn"></el-option>
                        <el-option label="大豆" value="soybean"></el-option>
                        <el-option label="蔬菜" value="vegetables"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="认证材料" prop="certificates">
                    <el-upload
                        action="#"
                        list-type="picture-card"
                        :auto-upload="false">
                        <i class="el-icon-plus"></i>
                    </el-upload>
                </el-form-item>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button @click="dialogVisible = false">取 消</el-button>
                <el-button type="primary" @click="submitForm">确 定</el-button>
            </div>
        </el-dialog>

        <!-- 查看农户详情对话框 -->
        <el-dialog title="农户详情" :visible.sync="viewDialogVisible" width="800px">
            <el-descriptions :column="2" border>
                <el-descriptions-item label="农户名称">{{currentFarmer.name}}</el-descriptions-item>
                <el-descriptions-item label="联系人">{{currentFarmer.contact}}</el-descriptions-item>
                <el-descriptions-item label="联系电话">{{currentFarmer.phone}}</el-descriptions-item>
                <el-descriptions-item label="地址">{{currentFarmer.address}}</el-descriptions-item>
                <el-descriptions-item label="种植面积">{{currentFarmer.area}}亩</el-descriptions-item>
                <el-descriptions-item label="主要作物">{{currentFarmer.crops}}</el-descriptions-item>
                <el-descriptions-item label="认证状态">
                    <el-tag :type="getStatusType(currentFarmer.status)">{{getStatusName(currentFarmer.status)}}</el-tag>
                </el-descriptions-item>
                <el-descriptions-item label="注册时间">{{currentFarmer.createTime}}</el-descriptions-item>
            </el-descriptions>
            <div class="farmer-info">
                <h4>认证材料</h4>
                <el-image 
                    style="width: 200px; height: 200px"
                    :src="currentFarmer.certificateUrl"
                    :preview-src-list="[currentFarmer.certificateUrl]">
                </el-image>
            </div>
        </el-dialog>

        <!-- 认证对话框 -->
        <el-dialog title="农户认证" :visible.sync="verifyDialogVisible" width="500px">
            <el-form :model="verifyForm" :rules="verifyRules" ref="verifyForm" label-width="100px">
                <el-form-item label="认证结果" prop="result">
                    <el-radio-group v-model="verifyForm.result">
                        <el-radio label="1">通过</el-radio>
                        <el-radio label="0">不通过</el-radio>
                    </el-radio-group>
                </el-form-item>
                <el-form-item label="认证意见" prop="comment">
                    <el-input type="textarea" v-model="verifyForm.comment"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button @click="verifyDialogVisible = false">取 消</el-button>
                <el-button type="primary" @click="submitVerify">确 定</el-button>
            </div>
        </el-dialog>
    </div>
</div>

<script>
new Vue({
    el: '#app',
    data() {
        return {
            loading: false,
            farmers: [
                {
                    name: '张三农场',
                    contact: '张三',
                    phone: '13800138000',
                    address: '浙江省杭州市西湖区',
                    area: 100.5,
                    crops: ['水稻', '小麦'],
                    status: '1',
                    createTime: '2024-01-01 12:00:00',
                    certificateUrl: 'https://example.com/certificate.jpg'
                },
                {
                    name: '李四农场',
                    contact: '李四',
                    phone: '13800138001',
                    address: '浙江省杭州市萧山区',
                    area: 80.0,
                    crops: ['玉米', '大豆'],
                    status: '2',
                    createTime: '2024-01-02 12:00:00',
                    certificateUrl: 'https://example.com/certificate2.jpg'
                }
            ],
            searchForm: {
                name: '',
                status: ''
            },
            currentPage: 1,
            pageSize: 10,
            total: 100,
            dialogVisible: false,
            dialogTitle: '添加农户',
            isEdit: false,
            farmerForm: {
                name: '',
                contact: '',
                phone: '',
                address: '',
                area: 0,
                crops: [],
                certificates: []
            },
            rules: {
                name: [
                    { required: true, message: '请输入农户名称', trigger: 'blur' }
                ],
                contact: [
                    { required: true, message: '请输入联系人', trigger: 'blur' }
                ],
                phone: [
                    { required: true, message: '请输入联系电话', trigger: 'blur' },
                    { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号码', trigger: 'blur' }
                ],
                address: [
                    { required: true, message: '请输入地址', trigger: 'blur' }
                ],
                area: [
                    { required: true, message: '请输入种植面积', trigger: 'blur' }
                ],
                crops: [
                    { required: true, message: '请选择主要作物', trigger: 'change' }
                ]
            },
            viewDialogVisible: false,
            currentFarmer: {},
            verifyDialogVisible: false,
            verifyForm: {
                result: '1',
                comment: ''
            },
            verifyRules: {
                result: [
                    { required: true, message: '请选择认证结果', trigger: 'change' }
                ],
                comment: [
                    { required: true, message: '请输入认证意见', trigger: 'blur' }
                ]
            }
        }
    },
    methods: {
        getStatusType(status) {
            const types = {
                '0': 'info',
                '1': 'success',
                '2': 'warning'
            };
            return types[status] || 'info';
        },
        getStatusName(status) {
            const names = {
                '0': '未认证',
                '1': '已认证',
                '2': '认证中'
            };
            return names[status] || status;
        },
        handleSearch() {
            // 实现搜索逻辑
            console.log('搜索条件：', this.searchForm);
        },
        resetSearch() {
            this.searchForm = {
                name: '',
                status: ''
            };
        },
        handleSizeChange(val) {
            this.pageSize = val;
            // 重新加载数据
        },
        handleCurrentChange(val) {
            this.currentPage = val;
            // 重新加载数据
        },
        handleAdd() {
            this.dialogTitle = '添加农户';
            this.isEdit = false;
            this.farmerForm = {
                name: '',
                contact: '',
                phone: '',
                address: '',
                area: 0,
                crops: [],
                certificates: []
            };
            this.dialogVisible = true;
        },
        handleEdit(row) {
            this.dialogTitle = '编辑农户';
            this.isEdit = true;
            this.farmerForm = { ...row };
            this.dialogVisible = true;
        },
        handleView(row) {
            this.currentFarmer = { ...row };
            this.viewDialogVisible = true;
        },
        handleVerify(row) {
            this.currentFarmer = row;
            this.verifyForm = {
                result: '1',
                comment: ''
            };
            this.verifyDialogVisible = true;
        },
        handleDelete(row) {
            this.$confirm('确认删除该农户吗？', '提示', {
                type: 'warning'
            }).then(() => {
                // 实现删除逻辑
                this.$message.success('删除成功');
            }).catch(() => {});
        },
        submitForm() {
            this.$refs.farmerForm.validate((valid) => {
                if (valid) {
                    // 实现提交逻辑
                    this.$message.success(this.isEdit ? '修改成功' : '添加成功');
                    this.dialogVisible = false;
                }
            });
        },
        submitVerify() {
            this.$refs.verifyForm.validate((valid) => {
                if (valid) {
                    // 实现认证逻辑
                    this.$message.success('认证操作成功');
                    this.verifyDialogVisible = false;
                }
            });
        }
    }
})
</script>
</body>
</html>
