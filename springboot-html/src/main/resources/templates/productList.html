<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商品列表</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>body{margin:0;padding:0;}.content-container{margin:20px;padding:20px;}</style>
</head>
<body>
<script src="//unpkg.com/vue@2/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<div id="app">
    <div class="content-container">
        <el-card>
            <div slot="header">
                <span>商品列表</span>
                <el-button type="primary" size="small" style="float:right" @click="goAdd">添加商品</el-button>
            </div>
            <el-table :data="products" style="width:100%">
                <el-table-column prop="name" label="商品名称" width="180"></el-table-column>
                <el-table-column prop="category" label="分类" width="120"></el-table-column>
                <el-table-column prop="price" label="价格" width="120"></el-table-column>
                <el-table-column prop="stock" label="库存" width="120"></el-table-column>
                <el-table-column prop="unit" label="单位" width="80"></el-table-column>
                <el-table-column prop="farmer" label="农户" width="120"></el-table-column>
                <el-table-column label="操作" width="150">
                    <template slot-scope="scope">
                        <el-button type="text" size="small">编辑</el-button>
                        <el-button type="text" size="small" style="color:red">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </el-card>
    </div>
</div>
<script>
new Vue({
    el:'#app',
    data(){
        return {
            products:[
                {name:'有机大米',category:'粮食',price:'¥68.00',stock:1000,unit:'斤',farmer:'张三'},
                {name:'新鲜草莓',category:'水果',price:'¥39.90',stock:500,unit:'斤',farmer:'李四'}
            ]
        }
    },
    methods:{
        goAdd(){window.location.href='toAddProduct';}
    }
})
</script>
</body>
</html>
